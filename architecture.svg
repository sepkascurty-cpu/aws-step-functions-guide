<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1080" viewBox="0 0 1280 1080" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555555"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#888888"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#D13239"/>
    </marker>
  </defs>

  <!-- frame -->
  <rect x="10" y="10" width="1260" height="1060" fill="#ffffff" stroke="#4a4a4a" stroke-width="1.5"/>

  <!-- AWS cloud header -->
  <rect x="24" y="24" width="54" height="54" fill="#232F3E"/>
  <text x="51" y="60" fill="#ffffff" font-size="22" font-weight="bold" text-anchor="middle">aws</text>
  <text x="92" y="50" fill="#232F3E" font-size="17" font-weight="bold">AWS Cloud</text>
  <text x="92" y="72" fill="#555555" font-size="12.5" font-style="italic">ap-southeast-3 &#183; Asia Pacific (Jakarta)</text>

  <!-- users -->
  <text x="620" y="34" fill="#232F3E" font-size="13" font-weight="bold" text-anchor="middle">shop.example.com</text>
  <rect x="596" y="46" width="48" height="32" rx="4" fill="#ffffff" stroke="#555555" stroke-width="2"/>
  <line x1="620" y1="78" x2="620" y2="88" stroke="#555555" stroke-width="2"/>
  <line x1="606" y1="88" x2="634" y2="88" stroke="#555555" stroke-width="2"/>
  <text x="620" y="106" fill="#555555" font-size="12" font-style="italic" text-anchor="middle">Users</text>
  <line x1="620" y1="88" x2="620" y2="128" stroke="#555555" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="632" y="112" fill="#333333" font-size="11">HTTPS</text>

  <!-- Route 53 -->
  <rect x="588" y="130" width="64" height="64" rx="8" fill="#8C4FFF"/>
  <text x="620" y="174" fill="#ffffff" font-size="26" font-weight="bold" text-anchor="middle">53</text>
  <text x="620" y="212" fill="#232F3E" font-size="13" font-weight="bold" text-anchor="middle">Amazon Route 53</text>
  <text x="620" y="229" fill="#555555" font-size="11.5" font-style="italic" text-anchor="middle">DNS service</text>

  <!-- WAF -->
  <rect x="438" y="262" width="64" height="64" rx="8" fill="#D13239"/>
  <path d="M470,276 L486,283 V297 C486,308 479,314 470,317 C461,314 454,308 454,297 V283 Z" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <polyline points="462,296 468,302 479,290" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <text x="470" y="344" fill="#232F3E" font-size="13" font-weight="bold" text-anchor="middle">AWS WAF</text>
  <text x="470" y="361" fill="#555555" font-size="11.5" font-style="italic" text-anchor="middle">Web Application Firewall</text>
  <line x1="600" y1="194" x2="470" y2="260" stroke="#555555" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="512" y="222" fill="#333333" font-size="11" text-anchor="middle">shop.example.com</text>

  <!-- CloudFront -->
  <rect x="738" y="262" width="64" height="64" rx="8" fill="#8C4FFF"/>
  <circle cx="770" cy="294" r="18" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <ellipse cx="770" cy="294" rx="8" ry="18" fill="none" stroke="#ffffff" stroke-width="2"/>
  <line x1="752" y1="294" x2="788" y2="294" stroke="#ffffff" stroke-width="2"/>
  <text x="770" y="344" fill="#232F3E" font-size="13" font-weight="bold" text-anchor="middle">Amazon CloudFront</text>
  <text x="770" y="361" fill="#555555" font-size="11.5" font-style="italic" text-anchor="middle">CDN</text>
  <line x1="640" y1="194" x2="770" y2="260" stroke="#555555" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="716" y="220" fill="#333333" font-size="11" text-anchor="middle">media assets</text>

  <!-- WAF -> CloudFront -->
  <line x1="502" y1="294" x2="738" y2="294" stroke="#555555" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="620" y="284" fill="#333333" font-size="11" text-anchor="middle">inspected</text>

  <!-- Shield -->
  <rect x="1020" y="130" width="64" height="64" rx="8" fill="#D13239"/>
  <path d="M1052,142 L1068,149 V163 C1068,174 1061,180 1052,183 C1043,180 1036,174 1036,163 V149 Z" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <line x1="1052" y1="152" x2="1052" y2="172" stroke="#ffffff" stroke-width="2.5"/>
  <text x="1052" y="212" fill="#232F3E" font-size="13" font-weight="bold" text-anchor="middle">AWS Shield</text>
  <text x="1052" y="229" fill="#555555" font-size="11.5" font-style="italic" text-anchor="middle">DDoS protection</text>
  <line x1="1030" y1="182" x2="512" y2="288" stroke="#888888" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrG)"/>
  <text x="800" y="218" fill="#666666" font-size="11" font-style="italic" text-anchor="middle">protects</text>

