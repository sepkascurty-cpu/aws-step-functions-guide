  <rect x="738" y="752" width="160" height="66" rx="8" fill="#ED7100"/>
  <text x="762" y="795" fill="#ffffff" font-size="30" font-weight="bold" text-anchor="middle">&#955;</text>
  <text x="836" y="781" fill="#ffffff" font-size="12.5" font-weight="bold" text-anchor="middle">Reserve</text>
  <text x="836" y="799" fill="#ffffff" font-size="12.5" text-anchor="middle">Inventory</text>
  <rect x="914" y="752" width="160" height="66" rx="8" fill="#ED7100"/>
  <text x="938" y="795" fill="#ffffff" font-size="30" font-weight="bold" text-anchor="middle">&#955;</text>
  <text x="1012" y="781" fill="#ffffff" font-size="12.5" font-weight="bold" text-anchor="middle">Notify</text>
  <text x="1012" y="799" fill="#ffffff" font-size="12.5" text-anchor="middle">Customer</text>
  <text x="915" y="836" fill="#B25F00" font-size="11" font-style="italic" text-anchor="middle">Lambda &#183; serverless, scales automatically</text>

