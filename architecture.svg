  <text x="384" y="922" fill="#ffffff" font-size="10.5" font-style="italic" text-anchor="middle">(primary)</text>

  <!-- DB Subnet AZ2 -->
  <rect x="715" y="862" width="400" height="88" fill="#F2F7FD" stroke="#2E73B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="715" y="846" width="36" height="36" rx="4" fill="#2E73B8"/>
  <rect x="727" y="860" width="12" height="10" rx="2" fill="none" stroke="#ffffff" stroke-width="2"/>
  <path d="M729,860 v-3 a4,4 0 0 1 8,0 v3" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text x="759" y="871" fill="#2E73B8" font-size="13" font-weight="bold">DB Subnet</text>
  <rect x="738" y="884" width="210" height="50" rx="8" fill="#2E73B8"/>
  <ellipse cx="762" cy="900" rx="12" ry="5" fill="none" stroke="#ffffff" stroke-width="2"/>
  <path d="M750,900 v14 a12,5 0 0 0 24,0 v-14" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text x="854" y="905" fill="#ffffff" font-size="12.5" font-weight="bold" text-anchor="middle">OrderState</text>
  <text x="854" y="922" fill="#ffffff" font-size="10.5" font-style="italic" text-anchor="middle">(replica)</text>

  <text x="680" y="912" fill="#777777" font-size="11.5" font-style="italic" text-anchor="middle">DB subnet group</text>

  <!-- Lambda -> DynamoDB arrows -->
  <line x1="345" y1="818" x2="360" y2="882" stroke="#555555" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="296" y="856" fill="#333333" font-size="10.5" text-anchor="middle">read / write</text>
  <line x1="524" y1="818" x2="450" y2="882" stroke="#555555" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="815" y1="818" x2="830" y2="882" stroke="#555555" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="994" y1="818" x2="920" y2="882" stroke="#555555" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- S3 (regional, left of VPC) -->
  <rect x="60" y="620" width="64" height="64" rx="8" fill="#3F8624"/>
  <path d="M76,638 h32 l-4,26 h-24 Z" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <path d="M80,638 a12,8 0 0 1 24,0" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <text x="92" y="702" fill="#232F3E" font-size="13" font-weight="bold" text-anchor="middle">Amazon S3</text>
  <text x="92" y="719" fill="#555555" font-size="11" font-style="italic" text-anchor="middle">Artifacts &#38; execution history</text>
  <line x1="500" y1="660" x2="126" y2="652" stroke="#888888" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrG)"/>
  <text x="300" y="642" fill="#666666" font-size="11" font-style="italic" text-anchor="middle">archive</text>

  <!-- SQS (regional, left of VPC) -->
  <rect x="60" y="790" width="64" height="64" rx="8" fill="#D13239"/>
  <line x1="74" y1="806" x2="110" y2="806" stroke="#ffffff" stroke-width="3"/>
  <line x1="74" y1="816" x2="110" y2="816" stroke="#ffffff" stroke-width="3"/>
  <line x1="74" y1="826" x2="104" y2="826" stroke="#ffffff" stroke-width="3"/>
  <path d="M104,820 L112,826 L104,832" fill="none" stroke="#ffffff" stroke-width="3"/>
  <text x="92" y="872" fill="#232F3E" font-size="13" font-weight="bold" text-anchor="middle">Amazon SQS</text>
  <text x="92" y="889" fill="#555555" font-size="11" font-style="italic" text-anchor="middle">DLQ &#8212; failed tasks</text>
  <line x1="500" y1="688" x2="126" y2="822" stroke="#D13239" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrR)"/>
  <text x="300" y="762" fill="#D13239" font-size="11" text-anchor="middle">Catch &#8594; dead-letter</text>

  <!-- SNS (regional, right of VPC) -->
  <rect x="1186" y="620" width="64" height="64" rx="8" fill="#D13239"/>
  <path d="M1218,632 c-6,0 -10,5 -10,11 v5 l-3,5 h26 l-3,-5 v-5 c0,-6 -4,-11 -10,-11 Z" fill="#ffffff"/>
  <circle cx="1218" cy="657" r="2.5" fill="#ffffff"/>
  <text x="1218" y="702" fill="#232F3E" font-size="13" font-weight="bold" text-anchor="middle">Amazon SNS</text>
  <text x="1218" y="719" fill="#555555" font-size="11" font-style="italic" text-anchor="middle">Order events topic</text>
  <line x1="830" y1="660" x2="1184" y2="652" stroke="#555555" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="1010" y="642" fill="#333333" font-size="11" text-anchor="middle">publish events</text>

  <!-- CloudWatch (regional, right of VPC) -->
  <rect x="1186" y="790" width="64" height="64" rx="8" fill="#D13239"/>
  <path d="M1198,826 a20,20 0 0 1 40,0" fill="none" stroke="#ffffff" stroke-width="3"/>
  <line x1="1218" y1="826" x2="1218" y2="810" stroke="#ffffff" stroke-width="3"/>
  <circle cx="1218" cy="826" r="3" fill="#ffffff"/>
  <text x="1218" y="872" fill="#232F3E" font-size="13" font-weight="bold" text-anchor="middle">Amazon CloudWatch</text>
  <text x="1218" y="889" fill="#555555" font-size="11" font-style="italic" text-anchor="middle">Metrics, logs &#38; alarms</text>
  <line x1="830" y1="688" x2="1184" y2="822" stroke="#888888" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrG)"/>
  <text x="1010" y="762" fill="#666666" font-size="11" font-style="italic" text-anchor="middle">execution metrics</text>

  <!-- legend -->
  <text x="40" y="1042" fill="#666666" font-size="11.5" font-style="italic">Solid arrows = request flow &#183; Dashed arrows = async / monitoring traffic</text>
</svg>
