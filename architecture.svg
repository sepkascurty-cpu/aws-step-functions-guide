  <rect x="245" y="716" width="400" height="128" fill="#F2F7FD" stroke="#2E73B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="245" y="700" width="36" height="36" rx="4" fill="#2E73B8"/>
  <rect x="257" y="714" width="12" height="10" rx="2" fill="none" stroke="#ffffff" stroke-width="2"/>
  <path d="M259,714 v-3 a4,4 0 0 1 8,0 v3" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text x="289" y="725" fill="#2E73B8" font-size="13" font-weight="bold">App Subnet</text>
  <rect x="268" y="752" width="160" height="66" rx="8" fill="#ED7100"/>
  <text x="292" y="795" fill="#ffffff" font-size="30" font-weight="bold" text-anchor="middle">&#955;</text>
  <text x="366" y="781" fill="#ffffff" font-size="12.5" font-weight="bold" text-anchor="middle">Validate</text>
  <text x="366" y="799" fill="#ffffff" font-size="12.5" text-anchor="middle">Order</text>
  <rect x="444" y="752" width="160" height="66" rx="8" fill="#ED7100"/>
  <text x="468" y="795" fill="#ffffff" font-size="30" font-weight="bold" text-anchor="middle">&#955;</text>
  <text x="542" y="781" fill="#ffffff" font-size="12.5" font-weight="bold" text-anchor="middle">Process</text>
  <text x="542" y="799" fill="#ffffff" font-size="12.5" text-anchor="middle">Payment</text>
  <text x="445" y="836" fill="#B25F00" font-size="11" font-style="italic" text-anchor="middle">Lambda &#183; serverless, scales automatically</text>

  <!-- App Subnet AZ2 -->
  <rect x="715" y="716" width="400" height="128" fill="#F2F7FD" stroke="#2E73B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="715" y="700" width="36" height="36" rx="4" fill="#2E73B8"/>
  <rect x="727" y="714" width="12" height="10" rx="2" fill="none" stroke="#ffffff" stroke-width="2"/>
  <path d="M729,714 v-3 a4,4 0 0 1 8,0 v3" fill="none" stroke="#ffffff" stroke-width="2"/>
