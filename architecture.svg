  <rect x="200" y="530" width="960" height="470" fill="none" stroke="#3F8624" stroke-width="2.5" stroke-dasharray="10 7"/>
  <rect x="216" y="544" width="42" height="42" rx="6" fill="#3F8624"/>
  <path d="M222,576 L237,563 L252,576 V586 H222 Z" fill="none" stroke="#ffffff" stroke-width="2.5"/>
