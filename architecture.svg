  <line x1="540" y1="704" x2="345" y2="750" stroke="#555555" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="600" y1="704" x2="524" y2="750" stroke="#555555" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="740" y1="704" x2="815" y2="750" stroke="#555555" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="800" y1="704" x2="994" y2="750" stroke="#555555" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="470" y="726" fill="#333333" font-size="10.5" text-anchor="middle">invoke</text>

  <!-- DB Subnet AZ1 -->
  <rect x="245" y="862" width="400" height="88" fill="#F2F7FD" stroke="#2E73B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="245" y="846" width="36" height="36" rx="4" fill="#2E73B8"/>
  <rect x="257" y="860" width="12" height="10" rx="2" fill="none" stroke="#ffffff" stroke-width="2"/>
  <path d="M259,860 v-3 a4,4 0 0 1 8,0 v3" fill="none" stroke="#ffffff" stroke-width="2"/>
