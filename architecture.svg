  <!-- AZ 2 -->
  <rect x="695" y="592" width="440" height="388" fill="none" stroke="#2E73B8" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="915" y="618" fill="#2E73B8" font-size="14" font-weight="bold" text-anchor="middle">Availability Zone 2</text>

  <!-- Step Functions (regional, spans AZs like ELB in the reference) -->
  <rect x="500" y="636" width="330" height="68" rx="8" fill="#ED7100"/>
  <line x1="530" y1="658" x2="546" y2="658" stroke="#ffffff" stroke-width="2.5"/>
  <line x1="546" y1="658" x2="538" y2="680" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="524" cy="658" r="6.5" fill="#ED7100" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="552" cy="658" r="6.5" fill="#ED7100" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="538" cy="686" r="6.5" fill="#ED7100" stroke="#ffffff" stroke-width="2.5"/>
  <text x="566" y="662" fill="#ffffff" font-size="15" font-weight="bold">AWS Step Functions</text>
  <text x="566" y="686" fill="#ffffff" font-size="12" font-style="italic">Standard workflow &#183; order orchestrator</text>
