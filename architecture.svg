  <rect x="588" y="410" width="64" height="64" rx="8" fill="#8C4FFF"/>
  <path d="M602,462 V442 C602,428 638,428 638,442 V462" fill="none" stroke="#ffffff" stroke-width="3"/>
  <line x1="598" y1="462" x2="642" y2="462" stroke="#ffffff" stroke-width="3"/>
  <text x="620" y="492" fill="#232F3E" font-size="13" font-weight="bold" text-anchor="middle">Amazon API Gateway</text>
  <text x="620" y="509" fill="#555555" font-size="11.5" font-style="italic" text-anchor="middle">REST API entry point</text>
  <line x1="756" y1="326" x2="640" y2="408" stroke="#555555" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="716" y="368" fill="#333333" font-size="11" text-anchor="middle">POST /orders</text>

